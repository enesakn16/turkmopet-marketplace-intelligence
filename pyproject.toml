[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turkmopet-marketplace-intelligence"
version = "0.5.0"
description = "Explainable marketplace pricing and profitability analysis for motorcycle parts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enes Akın" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
marketplace-analyze = "turkmopet_marketplace.cli:main"
marketplace-performance = "turkmopet_marketplace.performance_cli:main"
marketplace-performance-compare = "turkmopet_marketplace.performance_compare_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["turkmopet_marketplace"]
